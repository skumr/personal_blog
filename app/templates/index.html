{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}
<h1>Welcome to My Blog</h1>
<h2>This is the home page...</h2>
<p>Blogs coming soon!</p>
<form target="posts.html" action="/create-post" method="post">
    <label for="title">Title:</label>
    <input type="text" name="post-title" placeholder="Enter title">

    <label for="content">Conent:</label>
    <input type="text" name="post-content" placeholder="What would you like to post today?">
    
    <button type="submit">Create Post</button>
</form>
{% endblock %}
