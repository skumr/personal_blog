{% extends "base.html" %}

{% block title %}
All Posts
{% endblock %}

{% block content %}
<h1>This is where you can find all of my posts</h1>
<section id="post-content">
    <ul>
        {% for item in all_posts %}
            <li>Title:{{ item[0] }}
                <br>
                Content: {{ item[1] }}
            </li>
        {% endfor %}
    </ul>

</section>
{% endblock %}
