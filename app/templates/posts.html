{% extends "base.html" %}

{% block title %}
All Posts
{% endblock %}

{% block content %}
<h1>This is where you can find all of my posts</h1>
<section class="post-content">
    <ul>
        {% for item in all_posts %}
            <li>{{ item }}</li>
        {% endfor %}
    </ul>

</section>
{% endblock %}
