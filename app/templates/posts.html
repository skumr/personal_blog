{% extends "base.html" %}

{% block title %}
All Posts
{% endblock %}

{% block content %}
<body>
    <h1>All Blog Posts</h1>
    {% for post in all_posts %}
        <div class="post">
            <b>#{{ post[0] }}</b>
            <p>Title: {{ post[1] }}</p>
            <p>Content: {{ post[2] }}</p>
            <button>Edit</button>
            <button>Delete</button>
        </div>
    {% endfor %}
</body>
{% endblock %}
